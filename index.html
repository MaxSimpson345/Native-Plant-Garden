<!DOCTYPE html>
<html>
<head>
    <title>Native Plant Learning Garden</title>

    <!-- Leaflet CSS -->
    <link
        rel="stylesheet"
        href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    />

    <style>
        #map {
            height: 100vh;
            width: 100%;
        }
    </style>
</head>

<body>

    <div id="map"></div>

    <!-- Leaflet JavaScript -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <script>

        // =========================================================
        // MAP MOVEMENT BOUNDARY
        // =========================================================

        // This is intentionally larger than the actual garden.
        // It controls where the user is allowed to move the map.

        const movementBounds = L.latLngBounds(
            [47.73435, -122.25735],   // Southwest
            [47.73485, -122.25675]    // Northeast
        );


        // =========================================================
        // CREATE MAP
        // =========================================================

        const map = L.map('map', {
            minZoom: 17,

            // Allows extremely close zooming
            maxZoom: 30,

            // Prevents the user from wandering away
           // maxBounds: movementBounds,

            // Makes the boundary firm
            //maxBoundsViscosity: 1.0

        }).setView(
            [47.7346560, -122.2569252],
            19
        );


        // =========================================================
        // OPENSTREETMAP BASEMAP
        // =========================================================

        L.tileLayer(
            'https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',
            {
                // Highest zoom level where OSM actually has tiles
                maxNativeZoom: 19,

                // But allow Leaflet to keep zooming
                maxZoom: 30,

                attribution:
                    '&copy; OpenStreetMap contributors'
            }
        ).addTo(map);


        // =========================================================
        // GARDEN GEOMETRY
        // =========================================================

        fetch('garden-geometry.geojson')

            .then(response => response.json())

            .then(data => {

                const garden = L.geoJSON(data, {

                    style: {
                        color: '#3388ff',
                        weight: 3,
                        fillColor: '#3388ff',
                        fillOpacity: 0.15
                    }

                }).addTo(map);


                // Zoom to the garden when the page loads
                map.fitBounds(garden.getBounds());

            })

            .catch(error => {

                console.error(
                    'Could not load garden-geometry.geojson:',
                    error
                );

            });


        // =========================================================
        // PLANT POINT STYLE
        // =========================================================

        const plantStyle = {

            // Very small dot
            radius: 2,

            // Outline
            color: '#000000',

            // Outline thickness
            weight: 1,

            // Inside color
            fillColor: '#3388ff',

            // Fully visible
            fillOpacity: 1

        };


        // =========================================================
        // PLANT 6
        // =========================================================

        L.circleMarker(
            [47.7346560, -122.2569456],
            plantStyle
        )
        .addTo(map)
        .bindPopup(
            "<b>Plant 6: Salal (Gaultheria shallon)</b><br>" +
            "Placeholder text. Can add health info or anything we want here."
        );


        // =========================================================
        // OTHER PLANT POINTS
        // =========================================================

        L.circleMarker([47.7346974, -122.2569538], plantStyle)
            .addTo(map)
            .bindPopup("<b>New Point 1</b>");

        L.circleMarker([47.7345770, -122.2570473], plantStyle)
            .addTo(map)
            .bindPopup("<b>New Point 2</b>");

        L.circleMarker([47.7344863, -122.2570291], plantStyle)
            .addTo(map)
            .bindPopup("<b>New Point 3</b>");

        L.circleMarker([47.7345030, -122.2570256], plantStyle)
            .addTo(map)
            .bindPopup("<b>New Point 4</b>");

        L.circleMarker([47.7345285, -122.2570149], plantStyle)
            .addTo(map)
            .bindPopup("<b>New Point 5</b>");

        L.circleMarker([47.7345389, -122.2570277], plantStyle)
            .addTo(map)
            .bindPopup("<b>New Point 6</b>");

        L.circleMarker([47.7345305, -122.2570339], plantStyle)
            .addTo(map)
            .bindPopup("<b>New Point 7</b>");

        L.circleMarker([47.7345457, -122.2570543], plantStyle)
            .addTo(map)
            .bindPopup("<b>New Point 8</b>");

        L.circleMarker([47.7345297, -122.2570654], plantStyle)
            .addTo(map)
            .bindPopup("<b>New Point 9</b>");

        L.circleMarker([47.7345306, -122.2570681], plantStyle)
            .addTo(map)
            .bindPopup("<b>New Point 10</b>");

        L.circleMarker([47.7345339, -122.2570725], plantStyle)
            .addTo(map)
            .bindPopup("<b>New Point 11</b>");

        L.circleMarker([47.7345046, -122.2571349], plantStyle)
            .addTo(map)
            .bindPopup("<b>New Point 12</b>");

        L.circleMarker([47.7344975, -122.2571361], plantStyle)
            .addTo(map)
            .bindPopup("<b>New Point 13</b>");

        L.circleMarker([47.7344831, -122.2571443], plantStyle)
            .addTo(map)
            .bindPopup("<b>New Point 14</b>");

        L.circleMarker([47.7344940, -122.2571582], plantStyle)
            .addTo(map)
            .bindPopup("<b>New Point 15</b>");

        L.circleMarker([47.7345022, -122.2571666], plantStyle)
            .addTo(map)
            .bindPopup("<b>New Point 16</b>");

        L.circleMarker([47.7345199, -122.2571661], plantStyle)
            .addTo(map)
            .bindPopup("<b>New Point 17</b>");

        L.circleMarker([47.7345362, -122.2571556], plantStyle)
            .addTo(map)
            .bindPopup("<b>New Point 18</b>");

        L.circleMarker([47.7345397, -122.2571437], plantStyle)
            .addTo(map)
            .bindPopup("<b>New Point 19</b>");

    </script>

</body>
</html>
