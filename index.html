<!DOCTYPE html>
<html>
<head>
    <title>Native Plant Learning Garden</title>
<!-- Leaflet CSS -->
<link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
/>

<style>
    #map {
        height: 100vh;
        width: 100%;
        background: #cfe8c8;
    }

    .other-point {
        background: transparent;
        border: none;
    }

    .other-point div {
        width: 0;
        height: 0;
        border-left: 6px solid transparent;
        border-right: 6px solid transparent;
        border-bottom: 11px solid #000000;
    }

    .plant-filter {
        position: absolute;
        top: 10px;
        right: 10px;
        z-index: 1000;
        background: white;
        padding: 10px;
        border-radius: 6px;
        box-shadow: 0 1px 5px rgba(0,0,0,0.3);
        max-width: 220px;
        max-height: 80vh;
        overflow-y: auto;
        font-family: Arial, sans-serif;
    }

    .plant-filter-title {
        font-weight: bold;
        margin-bottom: 7px;
    }

    .plant-filter button {
        display: block;
        width: 100%;
        margin: 3px 0;
        padding: 5px 8px;
        border: 1px solid #aaa;
        border-radius: 4px;
        background: white;
        text-align: left;
        cursor: pointer;
        font-size: 13px;
    }

    .plant-filter button:hover {
        background: #eeeeee;
    }

    .plant-filter button.active {
        font-weight: bold;
        background: #dddddd;
    }

</style>
</head>

<div id="map"></div>

    plantPoints = plantPoints.map(point => ({
    ...point,
    lon: point.lon + 0.000043837
}));

    // =========================================================
    // PLANT COLORS
    // Color is determined by the number of points for each
    // plant type.
    //
    // Fewer points = lighter green
    // More points = darker green
    //
    // "Other" is excluded from this calculation.
    // =========================================================

    const plantCounts = {};

    plantPoints.forEach(point => {
        if (point.name !== "Other") {
            if (!plantCounts[point.name]) {
                plantCounts[point.name] = 0;
            }

            plantCounts[point.name]++;
        }
    });

    const plantColors = {};

    const plantCountValues = Object.values(plantCounts);

    const minPlantCount = Math.min(...plantCountValues);
    const maxPlantCount = Math.max(...plantCountValues);


    function getPlantColor(name) {

        if (name === "Other") {
            return "#000000";
        }

        if (!plantColors[name]) {

            const count = plantCounts[name];

            let ratio;

            if (maxPlantCount === minPlantCount) {
                ratio = 0.5;
            } else {
                ratio =
                    (count - minPlantCount) /
                    (maxPlantCount - minPlantCount);
            }

            // Light green for the fewest points.
            // Dark green for the most points.
            const lightness = 78 - (ratio * 48);

            plantColors[name] =
                `hsl(130, 45%, ${lightness}%)`;
        }

        return plantColors[name];
    }


    function getPlantStyle(name) {

        const color = getPlantColor(name);

        return {
            radius: 3,
            color: "#000000",
            weight: 1,
            fillColor: color,
            fillOpacity: 1
        };
    }


    // =========================================================
    // PLANT FILTER / LAYERS
    // =========================================================

    const plantLayers = {};
    const filterControl = L.control({ position: "topright" });

    filterControl.onAdd = function() {
        const div = L.DomUtil.create("div", "plant-filter");

        div.innerHTML =
            '<div class="plant-filter-title">Plant Types</div>' +
            '<button id="show-all-plants" class="active">Show All</button>';

        L.DomEvent.disableClickPropagation(div);
        return div;
    };

    filterControl.addTo(map);


    // =========================================================
    // CREATE PLANT POINTS
    // =========================================================

    plantPoints.forEach(point => {

        if (!plantLayers[point.name]) {

            plantLayers[point.name] = L.layerGroup();

            let button = document.createElement("button");

            button.textContent = point.name;
            button.dataset.plantName = point.name;

            button.addEventListener("click", function() {
                showOnlyPlant(point.name);
            });

            document
                .querySelector(".plant-filter")
                .appendChild(button);
        }


        // =====================================================
        // OTHER POINTS
        // =====================================================

        if (point.name === "Other") {

            const otherIcon = L.divIcon({
                className: "other-point",

                html:
                    '<div></div>',

                iconSize: [12, 11],
                iconAnchor: [6, 5.5]
            });

            L.marker(
                [point.lat, point.lon],
                { icon: otherIcon }
            )
            .bindPopup("<b>" + point.name + "</b>")
            .addTo(plantLayers[point.name]);


        // =====================================================
        // REGULAR PLANT POINTS
        // =====================================================

        } else {

            L.circleMarker(
                [point.lat, point.lon],
                getPlantStyle(point.name)
            )
            .bindPopup("<b>" + point.name + "</b>")
            .addTo(plantLayers[point.name]);

        }
    });


    // =========================================================
    // ADD ALL PLANT LAYERS INITIALLY
    // =========================================================

    Object.values(plantLayers).forEach(layer => {
        layer.addTo(map);
    });


    // =========================================================
    // SHOW ONLY ONE PLANT TYPE
    // =========================================================

    function showOnlyPlant(plantName) {

        Object.entries(plantLayers).forEach(([name, layer]) => {

            if (name === plantName) {

                if (!map.hasLayer(layer)) {
                    layer.addTo(map);
                }

            } else {

                if (map.hasLayer(layer)) {
                    map.removeLayer(layer);
                }

            }
        });


        document.querySelectorAll(".plant-filter button")
            .forEach(button => {
                button.classList.remove("active");
            });


        const selectedButton = document.querySelector(
            '[data-plant-name="' + CSS.escape(plantName) + '"]'
        );


        if (selectedButton) {
            selectedButton.classList.add("active");
        }


        document.getElementById("show-all-plants")
            .classList.remove("active");
    }


    // =========================================================
    // SHOW ALL PLANTS
    // =========================================================

    document.getElementById("show-all-plants")
        .addEventListener("click", function() {

            Object.values(plantLayers).forEach(layer => {

                if (!map.hasLayer(layer)) {
                    layer.addTo(map);
                }

            });


            document.querySelectorAll(".plant-filter button")
                .forEach(button => {
                    button.classList.remove("active");
                });


            this.classList.add("active");
        });
