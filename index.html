<!DOCTYPE html>
<html>
<head>
    <title>Native Plant Learning Garden</title>

    <!-- Leaflet CSS -->
    <link
        rel="stylesheet"
        href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    />

    <style>
        #map {
            height: 100vh;
            width: 100%;
        }
    </style>
</head>

<body>

    <div id="map"></div>

    <!-- Leaflet JavaScript -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <script>
        // Create the map
        const map = L.map('map').setView([47.7346560, -122.2569252], 22);

        // Add the map background
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19,
            attribution: '&copy; OpenStreetMap contributors'
        }).addTo(map);

        // Test marker
        L.marker([47.7346560, -122.2569456])
            .addTo(map)
            .bindPopup("<b>Plant 6: Salal (Gaultheria shallon)</b><br>Placeholder text. Can add health info or anything we want here.");
    </script>

</body>
</html>
